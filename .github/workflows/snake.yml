# Generates the contribution snake shown on the profile README
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0175C2&color_dots=#ebedf0,#b3e5fc,#4fc3f7,#0288d1,#02569b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#13B9FD&color_dots=#161b22,#0b3a5e,#0175C2,#13B9FD,#7fdbff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
